<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nerikone</title>
<meta name="nerikone-build" content="dev">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" sizes="32x32" href="app-icon/favicon-32.png">
<link rel="apple-touch-icon" href="app-icon/apple-touch-icon.png">
</head>
<body>
<header id="top">
  <div class="grp lead" id="leadbar"></div>
  <div class="grp center" id="modebar"></div>
  <div class="grp trail" id="appbar"></div>
</header>
<main id="view">
  <svg id="navgizmo" width="100" height="100" viewBox="-50 -50 100 100"></svg>
  <div id="viewlabel"></div>
  <div id="ctxbar" hidden></div>
  <div id="hud" hidden></div>
</main>
<nav id="tools" class="glass"><div id="toolsbody"></div></nav>
<div id="rcol">
<div id="rwidth"></div>
<aside id="side" class="glass dock">
  <div class="dhead"><span>アイテム</span></div>
  <div class="dbody" id="outliner"></div>
</aside>
<div class="rgrip"></div>
<aside id="inspector" class="glass dock">
  <div class="dhead" id="insphead"></div>
  <div class="dbody" id="inspbody"></div>
</aside>
<div class="rgrip"></div>
<aside id="histpane" class="glass dock">
  <div class="dhead"><span>履歴</span></div>
  <div class="dbody" id="timeline"></div>
</aside>
</div>
<section id="console" class="glass" hidden>
  <div class="chead"><b><i class="ti ti-terminal-2"></i> コンソール</b><span class="dim" id="buildinfo"></span>
    <button id="cfilter" data-tip="エラーだけ表示"><i class="ti ti-filter"></i></button>
    <button id="ccopy" data-tip="すべてコピー"><i class="ti ti-copy"></i></button>
    <button id="cserver" data-tip="サーバーのエラー履歴をコピー（AI 操作分も含む）"><i class="ti ti-terminal"></i></button>
    <button id="cclear" data-tip="消去"><i class="ti ti-clear-all"></i></button>
    <button id="cclose" data-tip="閉じる"><i class="ti ti-x"></i></button></div>
  <div id="clog"></div>
</section>
<div id="status"></div>
<div id="toast"></div>
<div id="menu" hidden></div>
<div id="palette" hidden><div class="pin"><i class="ti ti-search"></i><input id="pq" placeholder="コマンドを検索"></div><div id="plist"></div></div>
<div id="modal" hidden></div>
<input type="file" id="file" accept=".step,.stp,.iges,.igs,.stl,.obj,.glb,.3mf,.wrl,.wrz,.scad,.nrk" hidden>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
