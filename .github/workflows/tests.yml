# The test suite: kernel commands, document, file I/O, API and server, the viewer's JavaScript, and the browser
# build's WebAssembly kernel. Run locally with:  .venv/bin/python -m pytest
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r nerikone/requirements.txt pytest
      - name: WebAssembly kernel packages
        run: |
          mkdir -p .cache/web-local && cd .cache/web-local
          npm init -y > /dev/null
          npm install --no-audit --no-fund @classcad/smlibwasm@0.6.2 pyodide@314.0.8
      - run: python -m pytest
